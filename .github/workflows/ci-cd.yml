name: CI/CD

on:
  push:
    branches: [main]

jobs:
  checks:
    uses: ./.github/workflows/pr-checks.yml

  images:
    name: Build and push ${{ matrix.component }} image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # Registry paths must be lowercase; change these if the repository moves
          - component: backend
            image: ghcr.io/frankandreas/family-job-tracking/backend
          - component: frontend
            image: ghcr.io/frankandreas/family-job-tracking/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
