# Cloudflare Email Worker: forwards every mail for bewerbungen@<domain> to the app.
# Setup: README_DOCKER.md, "Incoming e-mails".
name = "family-jobs-inbound"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Sends the note to FALLBACK_ADDRESS (a verified Email Routing destination) when it gets a mail
[[send_email]]
name = "NOTIFY"

# Secrets, set with `npx wrangler secret put <NAME>`:
#   APP_URL                   public URL of the app through the Cloudflare Tunnel,
#                             e.g. https://bewerbungen.example.ch (a secret, so it stays out of the repo)
#   INBOUND_SECRET            same value as INBOUND_SECRET in the app's .env
#   CF_ACCESS_CLIENT_ID       Cloudflare Access service token for /api/inbound
#   CF_ACCESS_CLIENT_SECRET
#   FALLBACK_ADDRESS          optional: gets the mail when the app can't take it; must be a verified
#                             Email Routing destination address outside the routed domain
